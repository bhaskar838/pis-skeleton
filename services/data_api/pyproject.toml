[project]
name = "dcs-data-api"
version = "0.0.1"
description = "DCS-PIS tenant-scoped data API (every request goes through TenantContext)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dcs-common",
  "dcs-authz",
  "dcs-vault[aws]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
]

[project.scripts]
dcs-data-api = "data_api.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_api"]
