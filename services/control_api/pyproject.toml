[project]
name = "dcs-control-api"
version = "0.0.1"
description = "DCS-PIS control plane API + provisioning workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dcs-common",
  "dcs-authz",
  "dcs-vault[aws]",
  "dcs-cbm",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "temporalio>=1.8",
  "redis>=5.2",
  "boto3>=1.35",
  "aiosmtplib>=3.0",
  "httpx>=0.27",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
]

[project.scripts]
dcs-control-api = "control_api.main:run"
dcs-control-worker = "control_api.worker:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_api"]
