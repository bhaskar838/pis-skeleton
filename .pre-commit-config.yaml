repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(packages/py|services|tests|conftest\.py)
      - id: ruff-format
        files: ^(packages/py|services|tests|conftest\.py)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^infra/keycloak/realms/
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy -p dcs_common -p dcs_authz -p dcs_vault -p dcs_cbm -p control_api -p data_api -p realtime_gw
        language: system
        pass_filenames: false
        files: \.py$
      - id: eslint
        name: eslint
        entry: pnpm -r --if-present lint
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
