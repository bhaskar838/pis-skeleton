[project]
name = "dcs-cbm"
version = "0.0.1"
description = "Canonical Business Model + tenant DB migrations (Phase 0: schema baseline only)"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic>=1.14", "sqlalchemy>=2.0.36", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_cbm"]
