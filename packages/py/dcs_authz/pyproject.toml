[project]
name = "dcs-authz"
version = "0.0.1"
description = "RBAC policy engine: roles × permissions defined in policies.yaml (SPEC §8.3)"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0", "pydantic>=2.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_authz"]
